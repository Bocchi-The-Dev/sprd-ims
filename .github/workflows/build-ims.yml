name: build-ims

on:
  push:
    branches: [main]
    paths:
      - "sprd-ims/**"
      - "ims-service-entitlement/**"
      - "tools/build.sh"
      - ".github/workflows/build-ims.yml"
      - "docs/signing.md"
  pull_request:
    paths:
      - "sprd-ims/**"
      - "ims-service-entitlement/**"
      - "tools/build.sh"
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the APKs (needs the platform key secrets)"
        type: boolean
        default: true
      release:
        description: "Attach signed APK to release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-ims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          # apktool + aapt from apt. The 'aapt' package provides BOTH /usr/bin/aapt
          # and /usr/bin/aapt2. The Debian apktool repack strips the bundled
          # aapt binaries, so apktool falls back to the PATH binary; build.sh
          # passes --use-aapt2 so the modern one is used.
          sudo apt-get update -qq
          sudo apt-get install -y apktool aapt apksigner zipalign
          java -version 2>&1 | head -2
          apktool --version
          aapt version
          aapt2 version

      - name: Build + verify + sign
        env:
          KEYSTORE_B64: ${{ secrets.PLATFORM_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.PLATFORM_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.PLATFORM_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PLATFORM_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          # If a real platform key was supplied as a secret, materialise it.
          # Otherwise build.sh falls back to a throwaway debug key, which is
          # fine for testing on a userdebug GSI but will NOT satisfy
          # sharedUserId="android.uid.phone" signature matching on user builds.
          if [ -n "${KEYSTORE_B64:-}" ]; then
            mkdir -p secrets
            echo "$KEYSTORE_B64" | base64 -d > secrets/platform.jks
            echo "[ci] using platform keystore secret"
          fi
          chmod +x tools/build.sh
          if [ "${{ inputs.sign == '' && 'true' || inputs.sign }}" = "true" ]; then
            ./tools/build.sh
          else
            ./tools/build.sh --no-sign
          fi

      - name: Collect APK metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-info
          {
            echo "branch: ${{ github.ref_name }}"
            echo "commit: ${{ github.sha }}"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for f in dist/*.apk; do
              [ -f "$f" ] || continue
              echo "--- $f"
              stat -c 'size: %s bytes' "$f"
              apksigner verify --print-certs "$f" 2>/dev/null | sed 's/^/  /' | head -6
            done
          } | tee build-info/summary.txt

      - name: Upload built APKs
        uses: actions/upload-artifact@v4
        with:
          name: sprd-ims-filtered
          path: |
            dist/*.apk
            build-info/summary.txt
          if-no-files-found: error
          retention-days: 14
